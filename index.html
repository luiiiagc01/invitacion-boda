<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263b2b">
<meta name="description" content="Invitación digital de boda de Luis Fernando y Any Clarissa">
<title>Nuestra boda · Luis Fernando & Any Clarissa</title>
<style>
:root{--green:#263b2b;--gold:#c6a45b;--cream:#f8f0df}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#18251b;color:var(--cream);font-family:Georgia,serif}
body{overflow:hidden;display:flex;align-items:center;justify-content:center}
.app{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:10px 10px max(10px,env(safe-area-inset-bottom));}
.topbar{width:min(100%,520px);display:flex;align-items:center;justify-content:space-between;padding:3px 2px 9px;z-index:4;color:#f8edcf}
.brand{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;opacity:.9}
.iconbtn{border:1px solid #c6a45b88;background:#263b2bdd;color:#f9e8bd;border-radius:50%;width:38px;height:38px;font-size:18px;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 12px #0003}
.book{position:relative;width:min(100%,520px);height:min(calc(100dvh - 142px),900px);max-height:calc(100dvh - 142px);aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;perspective:1400px;filter:drop-shadow(0 16px 25px #0005)}
.page{position:absolute;inset:0;border-radius:3px;overflow:hidden;background:#f8f0df;transform-origin:left center;backface-visibility:hidden;opacity:0;pointer-events:none;transform:rotateY(-7deg) translateX(12px) scale(.99);transition:opacity .35s ease,transform .55s cubic-bezier(.2,.75,.25,1);box-shadow:inset 0 0 0 1px #d2bc83}
.page.active{opacity:1;pointer-events:auto;transform:rotateY(0) translateX(0) scale(1);z-index:2}
.page img{display:block;width:100%;height:100%;object-fit:contain;background:#f8f0df}
.hotspot{position:absolute;z-index:3;display:block;left:12%;top:53.8%;width:76%;height:7.5%;border-radius:30px;background:transparent;outline-offset:3px}.hotspot:focus-visible{outline:2px solid #c6a45b;background:#c6a45b18}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 18px #73552b12}
.nav{width:min(100%,520px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;z-index:4}
.navbtn{width:46px;height:42px;border-radius:24px;border:1px solid var(--gold);background:linear-gradient(135deg,#354a35,#1e3024);color:#f8e6b5;font-size:27px;line-height:1;cursor:pointer;box-shadow:0 3px 10px #0003}
.navbtn:disabled{opacity:.35;cursor:default}
.dots{display:flex;align-items:center;justify-content:center;gap:7px;flex:1;flex-wrap:wrap}
.dot{width:7px;height:7px;padding:0;border:1px solid #d7bd79;border-radius:50%;background:transparent;cursor:pointer;transition:transform .2s,background .2s}
.dot.active{background:#d8b969;transform:scale(1.35)}
.counter{font:10px/1.5 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#f1dfb2;text-align:center;padding-top:7px;z-index:4}
.progress{position:absolute;top:0;left:0;height:2px;background:var(--gold);width:0;transition:width .3s;z-index:10}
.leaf-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.leaf{position:absolute;top:-10vh;opacity:0;color:#d7c17e;text-shadow:0 1px 5px #f9edcf55;animation:fall linear infinite}
.leaf:nth-child(3n){color:#9cab7d}.leaf:nth-child(4n){color:#f3e6c7}
@keyframes fall{0%{transform:translate3d(0,-8vh,0) rotate(0deg);opacity:0}10%{opacity:.48}85%{opacity:.34}100%{transform:translate3d(var(--drift),115vh,0) rotate(300deg);opacity:0}}
.hint{font:10px Arial,sans-serif;color:#e6d6aeaa;letter-spacing:.6px;text-align:center;margin-top:5px}
@media(min-width:700px){.app{padding:16px}.book{height:min(calc(100dvh - 155px),900px)}}
@media(max-height:600px){.app{padding:3px 8px}.topbar{padding-bottom:4px}.iconbtn{width:31px;height:31px}.book{height:calc(100dvh - 105px);max-height:calc(100dvh - 105px)}.nav{padding-top:5px}.navbtn{height:34px;width:40px}.counter{padding-top:3px}.hint{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="leaf-layer" id="leaves" aria-hidden="true"></div>
<main class="app">
  <header class="topbar">
    <button class="iconbtn" id="musicBtn" aria-label="Activar o desactivar sonido decorativo" title="Sonido">♫</button>
    <div class="brand">Nuestra boda · L & A</div>
    <button class="iconbtn" id="menuBtn" aria-label="Mostrar páginas" title="Índice">☰</button>
  </header>
  <div class="book" id="book" aria-label="Libro de invitación de boda">
   
    <section class="page active" data-title="Portada">
  <img src="01-portada.png" alt="Portada de la invitación de boda">
</section>

<section class="page" data-title="Bienvenidos">
  <img src="02-bienvenidos.png" alt="Página de bienvenida">
</section>

<section class="page" data-title="Nuestra historia">
  <img src="03-nuestra-historia.png" alt="Nuestra historia">
</section>

<section class="page" data-title="Ceremonia y recepción">
  <img src="04-ceremonia-recepcion.png" alt="Detalles de la ceremonia y recepción">
</section>

<section class="page" data-title="Un amor que crece">
  <img src="05-foto.png" alt="Fotografía de la pareja">
</section>

<section class="page" data-title="Código de vestimenta">
  <img src="06-vestimenta.png" alt="Código de vestimenta">
</section>

<section class="page" data-title="Regalos">
  <img src="07-regalos.png" alt="Información de regalos">
</section>

<section class="page" data-title="Confirmación">
  <img src="08-confirmacion.png" alt="Confirmación de asistencia">
  <a class="hotspot"
     href="https://wa.me/50489755668?text=Hola%2C%20confirmo%20mi%20asistencia%20a%20la%20boda%20de%20Luis%20Fernando%20y%20Any%20Clarissa."
     target="_blank"
     rel="noopener"
     aria-label="Confirmar asistencia por WhatsApp"
     title="Confirmar asistencia por WhatsApp"></a>
</section>
  </div>
  <nav class="nav" aria-label="Navegación de páginas">
    <button class="navbtn" id="prev" aria-label="Página anterior">‹</button>
    <div class="dots" id="dots" aria-label="Elegir página"></div>
    <button class="navbtn" id="next" aria-label="Página siguiente">›</button>
  </nav>
  <div class="counter" id="counter" aria-live="polite">PORTADA · 1 / 8</div>
  <div class="hint">Desliza para pasar la página · Usa las flechas para navegar</div>
</main>
<script>
(() => {
 const pages=[...document.querySelectorAll('.page')], dots=document.getElementById('dots');
 const prev=document.getElementById('prev'), next=document.getElementById('next');
 const counter=document.getElementById('counter'), progress=document.getElementById('progress');
 let current=0, startX=0, startY=0;
 const names=pages.map(p=>p.dataset.title);
 names.forEach((name,i)=>{const b=document.createElement('button');b.className='dot'+(i===0?' active':'');b.setAttribute('aria-label','Ir a '+name);b.title=name;b.addEventListener('click',()=>go(i));dots.appendChild(b)});
 const dotButtons=[...dots.children];
 function go(n){
   current=Math.max(0,Math.min(pages.length-1,n));
   pages.forEach((p,i)=>{p.classList.toggle('active',i===current);p.setAttribute('aria-hidden',i===current?'false':'true')});
   dotButtons.forEach((d,i)=>{d.classList.toggle('active',i===current);d.setAttribute('aria-current',i===current?'page':'false')});
   prev.disabled=current===0;next.disabled=current===pages.length-1;
   counter.textContent=names[current].toLocaleUpperCase('es')+' · '+(current+1)+' / '+pages.length;
   progress.style.width=((current+1)/pages.length*100)+'%';
   document.title=names[current]+' · Luis Fernando & Any Clarissa';
 }
 prev.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current+1));
 document.getElementById('menuBtn').addEventListener('click',()=>{
   const list=names.map((n,i)=>(i+1)+'. '+n).join('\\n');
   const answer=prompt('Ir a una página:\\n'+list+'\\n\\nEscribe el número del 1 al '+pages.length, String(current+1));
   if(answer!==null && answer.trim()!=='' && Number.isFinite(Number(answer)))go(Number(answer)-1);
 });
 // Navegación táctil, sin interferir con los botones
 const book=document.getElementById('book');
 book.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});
 book.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)go(current+(dx<0?1:-1))},{passive:true});
 book.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});
 document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);if(e.key==='Home')go(0);if(e.key==='End')go(pages.length-1)});
 // Decoración sutil de hojas y pequeñas esporas; no tapa las páginas ni captura toques.
 const leafLayer=document.getElementById('leaves'), symbols=['🍃','✦','❧','·','✧'];
 for(let i=0;i<17;i++){const el=document.createElement('span');el.className='leaf';el.textContent=symbols[i%symbols.length];el.style.left=(Math.random()*100)+'%';el.style.fontSize=(8+Math.random()*12)+'px';el.style.animationDuration=(12+Math.random()*18)+'s';el.style.animationDelay=(-Math.random()*25)+'s';el.style.setProperty('--drift',((Math.random()*24)-12)+'vw');leafLayer.appendChild(el)}
 // Sin audio añadido: el botón da una respuesta visual, sin introducir música ajena.
 const music=document.getElementById('musicBtn');let musicOn=false;
 music.addEventListener('click',()=>{musicOn=!musicOn;music.textContent=musicOn?'♫̸':'♫';music.setAttribute('aria-pressed',String(musicOn));music.title=musicOn?'Sonido desactivado (sin pista adjunta)':'Sonido';});
 go(0);
})();
</script>
</body>
</html>
